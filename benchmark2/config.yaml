run:
  # stats | evaluate | report | all
  mode: all

dhmf:
  config_path: example/a/config_open.yaml
  query_mode: agent  # dual_path | agent

dataset:
  # 测试集 Excel（含问题表 + 统计表）。可换成测试问题集1：
  #   benchmark2/建筑涂料Graph-RAG测试问题集1.xlsx
  excel_path: benchmark2/建筑涂料行业超图评测测试集2.xlsx
  questions_sheet: null   # 空则自动识别
  stats_sheet: null       # 空则自动识别
  design_sheet: null      # 空则自动识别（仅测试集2有「设计说明」）
  n_limit: 10           # 只跑前 N 题；null = 全部
  id_list: null           # 指定题号列表，如 [1, 2, 10]；null = 不限制

paths:
  output_dir: benchmark2_results

  stats_filename: stats_queation2.json
  stats_path: null

  dataset_filename: dataset_queation2.json
  dataset_path: null

  eval_results_filename: evals_queation2.json
  eval_results_path: null

  report_source_filename: evals_queation2.json
  report_source_path: null

  report_filename: report_queation2.json
  report_path: null

evaluate:
  resume: true
  enable_llm_only: true   # 每题额外跑一路纯 LLM 对照
  max_retries: 10
  sleep_between: 0.0
  num_thread: 5
  use_cache: true
  dhmf_retrieve_use_cache: null
  api_key: null
  base_url: null
  timeout: 300
  model_args:
    model: null
    temperature: 0.0
    enable_thinking: false
    response_format:
      type: json_object

logging:
  level: INFO

run:
  # stats | evaluate | rejudge | report | excel | all
  mode: all

dhmf:
  config_path: example/a/config_open.yaml
  query_mode: agentic  # dual_path | agent | agentic

dataset:
  excel_path: benchmark2/建筑涂料测试问题集1.xlsx
  questions_sheet: null   # 空则自动识别
  stats_sheet: null       # 空则自动识别
  design_sheet: null      # 空则自动识别（仅测试集2有「设计说明」）
  n_limit: null           # 只跑前 N 题；null = 全部
  id_list: null           # 指定题号列表，如 [1, 2, 10]；null = 不限制

paths:
  output_dir: benchmark2_results/benchmark2_question1_results_agentic

  stats_filename: stats_question.json
  stats_path: null

  dataset_filename: dataset_question.json
  dataset_path: null

  eval_results_filename: evals_question.json
  eval_results_path: null

  report_source_filename: evals_question.json
  report_source_path: null

  report_filename: report_question.json
  report_path: null

  report_excel_filename: report_question.xlsx
  report_excel_path: null

evaluate:
  resume: true
  enable_llm_only: true   # 每题额外跑一路纯 LLM；与超图回答一次对比打分，不再分开评判
  max_retries: 2          # 仅 JSON 解析失败重试；HTTP 超时不再连着重试
  sleep_between: 0.0
  num_thread: 1
  use_cache: False
  dhmf_retrieve_use_cache: null
  api_key: null
  base_url: null
  timeout: 300            # 裁判 HTTP 超时
  model_args:             # 裁判
    model: null
    temperature: 0.0
    enable_thinking: false  # 开思考时裁判常打满 200–300s，再叠加超时重试会到 550s/题
    response_format:
      type: json_object

  # 纯 LLM 对照：与裁判 / retrieve.model_args 独立（勿共用 enable_thinking / timeout）
  llm_only:
    api_key: null         # 空则跟 retrieve / settings
    base_url: null
    timeout: 180          # 单次 HTTP 超时；卡住只等一轮，不再 300s×3
    max_retries: 2        # 超时不再重试；仅短失败可再试
    use_cache: False
    model_args:
      model: null       # 空则继承 retrieve.model_args.model
      temperature: 0.2
      enable_thinking: false

logging:
  level: INFO

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 182.92.85.174 172.17.105.227 _;

    root /var/www/chemical-rag;
    index index.html;

    server_tokens off;
    client_max_body_size 4m;

    proxy_connect_timeout 180s;
    proxy_send_timeout    900s;
    proxy_read_timeout    900s;
    send_timeout          900s;
    proxy_http_version 1.1;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 登录改到 API Bearer，不再用 nginx htpasswd。
    # /api/foo -> http://127.0.0.1:8000/foo ，并原样转发 Authorization。
    location = /api/stream {
        proxy_pass http://127.0.0.1:8000/stream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # 旧的公开路径一律 404，不再对外直出
    location = /health          { return 404; }
    location = /query           { return 404; }
    location = /multihop-query  { return 404; }
    location = /agentic-query   { return 404; }
    location = /retrieve        { return 404; }
    location = /docs            { return 404; }
    location = /redoc           { return 404; }
    location = /openapi.json    { return 404; }
    location = /api/docs        { return 404; }
    location = /api/docs/       { return 404; }
    location = /api/redoc       { return 404; }
    location = /api/redoc/      { return 404; }
    location = /api/openapi.json { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}



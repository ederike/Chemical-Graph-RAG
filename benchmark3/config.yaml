run:
  # evaluate | rejudge | report | excel | all
  mode: all

dhmf:
  config_path: example/a/config_open.yaml
  query_mode: agent  # dual_path | agent

dataset:
  csv_path: benchmark3/建筑涂料专利集问答测试问题.csv
  n_limit: null           # 只跑前 N 题；null = 全部
  id_list: null           # 指定题号，如 [F0001, F0002]；null = 不限制

paths:
  output_dir: benchmark3_results

  dataset_filename: dataset.json
  dataset_path: null

  eval_results_filename: evals.json
  eval_results_path: null

  report_source_filename: evals.json
  report_source_path: null

  report_filename: report.json
  report_path: null

  report_excel_filename: report.xlsx
  report_excel_path: null

evaluate:
  resume: true
  enable_llm_only: false  # true 时额外跑纯 LLM 对照
  max_retries: 10
  sleep_between: 0.0
  num_thread: 5
  use_cache: false
  dhmf_retrieve_use_cache: null
  api_key: null
  base_url: null
  timeout: 300
  model_args:
    model: null
    temperature: 0.0
    enable_thinking: true
    response_format:
      type: json_object

  llm_only:
    api_key: null
    base_url: null
    timeout: 300
    max_retries: 3
    use_cache: false
    model_args:
      model: null
      temperature: 0.2
      enable_thinking: false

logging:
  level: INFO

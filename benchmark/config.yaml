run:
  # generate | evaluate | report | excel | all
  mode: evaluate

dhmf:
  config_path: example/a/config_open.yaml
  query_mode: agentic  # dual_path | agent | agentic

paths:
  db_path: example/a/DB/main.db
  output_dir: benchmark_results/benchmark_result_agentic

  # generate 写出
  questions_filename: questions_complex.json
  questions_path: null

  # evaluate 读入
  eval_questions_filename: questions_complex.json
  eval_questions_path: null
  # evaluate 写出
  eval_results_filename: evals_complex.json
  eval_results_path: null
  
  # report 读入
  report_source_filename: evals_complex.json
  report_source_path: null
  # report 写出
  report_filename: report_complex.json
  report_path: null
  # excel 写出（空则与 report 同名 .xlsx）
  report_excel_filename: report_complex.xlsx
  report_excel_path: null

generate:
  hop_counts:
    "1": 100
    "2": 50
    '3': 50
  seed: 44
  max_chars_per_doc: -1
  max_retries: 3
  sleep_between: 20
  num_thread: 5          #
  use_cache: True
  question_gen_prompt: QUESTION_GEN_USER
  api_key: null
  base_url: null
  timeout: 600
  model_args:
    model: null
    temperature: 0.2
    enable_thinking: false
    response_format:
      type: json_object

evaluate:
  enable_llm_only: False   # 每题额外跑一路纯 LLM；与超图回答一次对比打分，不再分开评判
  enable_doc_recall: True
  max_source_chars: -1
  max_retries: 2
  sleep_between: 0.0
  num_thread: 4
  use_cache: False
  dhmf_retrieve_use_cache: null
  api_key: null
  base_url: null
  timeout: 300            # 裁判 HTTP 超时
  model_args:             # 裁判
    model: null
    temperature: 0.0
    enable_thinking: True
    response_format:
      type: json_object

  llm_only:
    api_key: null        
    base_url: null
    timeout: 300          
    max_retries: 3        
    use_cache: False
    model_args:
      model: null         
      temperature: 0.2
      enable_thinking: false

logging:
  level: INFO

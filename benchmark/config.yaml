run:
  
  mode: all  # generate| evaluate| all

dhmf:
  config_path: example/a/config_open.yaml
  query_mode: agent  #dual_path | agent

paths:
  db_path: example/a/DB/main.db
  output_dir: benchmark_results

  questions_filename: questions_standard_100.json
  questions_path: null

  eval_questions_filename: questions_standard_100_agent.json
  eval_questions_path: null

  report_filename: eval_report_standard_100_agent.json
  report_path: null

generate:
  hop_counts:
    "1": 50
    "2": 25
    "3": 25
  seed: 42
  max_chars_per_doc: -1
  max_retries: 3
  sleep_between: 0.0
  use_cache: false
  api_key: null
  base_url: null
  timeout: 180
  model_args:
    model: null
    temperature: 0.2
    enable_thinking: false
    response_format:
      type: json_object

evaluate:
  enable_doc_recall: False
  max_source_chars: -1
  max_retries: 3
  sleep_between: 0.0
  save_summary: true  # 写出 eval_report*.summary.json（详细统计）
  use_cache: false
  dhmf_retrieve_use_cache: null
  api_key: null
  base_url: null
  timeout: 180
  model_args:
    model: null
    temperature: 0.0
    enable_thinking: false
    response_format:
      type: json_object

logging:
  level: INFO

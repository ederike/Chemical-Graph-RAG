# benchmark_agentic_5：example/b 的 200 文件上，Agentic vs WeKnora。
# 禁止改成 example/a。路径一律相对仓库根目录。
run:
  # generate | evaluate | report | excel | all
  mode: all

dhmf:
  config_path: example/b/config_open.yaml
  query_mode: agentic

paths:
  db_path: example/b/DB/main.db
  output_dir: results/benchmark_agentic_5_与weknora对比

  questions_filename: questions.json
  questions_path: null

  eval_questions_filename: questions.json
  eval_questions_path: null
  eval_results_filename: evals.json
  eval_results_path: null

  report_source_filename: evals.json
  report_source_path: null
  report_filename: report.json
  report_path: null
  report_excel_filename: report.xlsx
  report_excel_path: null

generate:
  hop_counts:
    "1": 100
    "2": 50
    "3": 50
  original_pdf_only: true
  doc_id_min: null
  doc_id_max: null
  doc_id_range: null
  seed: 42
  max_chars_per_doc: -1
  max_retries: 3
  sleep_between: 0.0
  num_thread: 8
  use_cache: false
  question_gen_prompt: QUESTION_GEN_USER
  api_key: null
  base_url: null
  timeout: 6000
  model_args:
    model: null
    temperature: 0.2
    enable_thinking: false
    response_format:
      type: json_object

evaluate:
  enable_weknora: true
  enable_doc_recall: true
  max_source_chars: -1
  max_retries: 2
  sleep_between: 0.0
  num_thread: 1
  use_cache: false
  dhmf_retrieve_use_cache: null
  api_key: null
  base_url: null
  timeout: 3000
  model_args:
    model: null
    temperature: 0.0
    enable_thinking: true
    response_format:
      type: json_object

weknora:
  base_url: http://192.168.110.219:8081
  email: 18570740519@163.com
  password: kyadminai202609
  # 当前空间里与 example/b 对应的库名是 test（约 155/200 篇已完成）
  knowledge_base_id: 677e7f95-5530-4872-8412-55abbe459b7f
  knowledge_base_name: test
  # agent = POST /api/v1/agent-chat（内置快速问答）
  chat_mode: agent
  agent_id: builtin-quick-answer
  agent_enabled: true
  timeout: 300
  max_retries: 2
  new_session_per_question: true
  delete_session: true
  session_title_prefix: benchmark_agentic_5

logging:
  level: INFO
